<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>An App V5</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <header class="top_bar">
    <div>
      <p class="eyebrow">an app</p>
      <h1>Application Builder</h1>
    </div>
    <div class="status_strip" aria-label="status">
      <span id="branch_label">dot_agent_lang_and_memory_v1</span>
      <span id="validation_label">ready</span>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar" aria-label="templates">
      <h2>Templates</h2>
      <div id="template_list" class="template_list"></div>
    </aside>

    <section class="main_area" aria-label="builder">
      <div class="command_row">
        <input id="command_input" type="text" value="create application builder" aria-label="command input">
        <button id="run_button" type="button" class="primary">Run</button>
      </div>

      <nav class="projection_tabs" aria-label="layout projections">
        <button type="button" data-profile="block_editor" class="active">Block Editor</button>
        <button type="button" data-profile="tree">Tree</button>
        <button type="button" data-profile="diagram">Diagram</button>
        <button type="button" data-profile="table">Table</button>
        <button type="button" data-profile="notebook">Notebook</button>
        <button type="button" data-profile="code_editor">Code Editor</button>
      </nav>

      <section class="preview_band">
        <div>
          <p class="eyebrow">preview</p>
          <h2 id="app_name">application_builder_application</h2>
          <p id="preview_path">/preview/app_application_builder_demo</p>
        </div>
        <div class="summary_grid" id="summary_grid"></div>
      </section>

      <section class="surface_grid">
        <article class="panel main_panel">
          <h2>Editor</h2>
          <div class="projection_view" id="projection_view"></div>
        </article>

        <article class="panel">
          <h2>Properties</h2>
          <div id="properties_panel"></div>
        </article>
      </section>
    </section>
  </main>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
