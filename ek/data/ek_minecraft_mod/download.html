            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4);
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 229, 255, 0.6);
        }

        .download-btn svg {
            width: 24px;
            height: 24px;
        }

        .file-info {

            font-size: 0.9rem;

        .file-info code {
