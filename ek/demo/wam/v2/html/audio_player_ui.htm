<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAM Audio Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f4f4f6;
      --paper-light: #fcfcfd;
      --ink: #2f3646;
      --ink-light: #64748b;
      --accent: #38bdf8;
      --accent-dark: #0ea5e9;
      --bg-overlay: rgba(47, 59, 79, 0.7);
      --bg-control: rgba(23, 31, 50, 0.5);
      --border-light: rgba(15, 23, 42, 0.06);
      --border-light-2: rgba(15, 23, 42, 0.06);
      --shadow-player: 0px 15px 25px rgba(15, 23, 42, 0.1), 0px 5px 10px rgba(15, 23, 42, 0.04);
      --shadow-button: 0px 1px 3px rgba(0, 0, 0, 0.1), 0px 1px 2px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      font-family: "Urbanist", sans-serif;
      background: linear-gradient(145deg, #f5f7fb, #eef2f7);
      color: var(--ink);
    }

    .player-container {
      position: relative;
      width: min(40rem, 100%);
      display: flex;
      flex-direction: column;
      border-radius: 0.75rem;
      box-shadow: var(--shadow-player);
      background: var(--paper-light);
      border: 1px solid var(--border-light);
      overflow: hidden;
    }

    .dark .player-container {
      background: var(--bg-overlay);
      border-color: rgba(255, 255, 255, 0.16);
      box-shadow: inset 0px 2px 4px rgba(255, 255, 255, 0.06);
    }

    .dark-mode-toggle {
      position: absolute;
      right: 1rem;
      top: 1rem;
      cursor: pointer;
      z-index: 50;
    }

    .dark-mode-toggle svg {
      width: 1.5rem;
      height: 1.5rem;
    }

    .song-info {
      padding: 2.5rem 2.5rem 1rem;
      display: flex;
      align-items: center;
      z-index: 50;
    }

    .song-info img {
      width: 6rem;
      height: 6rem;
      border-radius: 0.375rem;
      margin-right: 1.5rem;
      border: 1px solid var(--border-light);
    }

    .dark .song-info img {
      border-color: rgba(255, 255, 255, 0.1);
    }

    .song-info-details {
      display: flex;
      flex-direction: column;
    }

    .song-info-details .song-name {
      font-size: 1.125rem;
      font-weight: 500;
      line-height: 1.75rem;
      color: #0f172a;
      letter-spacing: 0.025em;
    }

    .dark .song-info-details .song-name {
      color: #fff;
    }

    .song-info-details .artist-name,
    .song-info-details .album-name {
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.5rem;
      color: #64748b;
      letter-spacing: 0.025em;
    }

    .dark .song-info-details .artist-name,
    .dark .song-info-details .album-name {
      color: #94a3b8;
    }

    .progress-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      padding: 0 2.5rem 1.5rem;
      z-index: 50;
    }

    .amplitude-song-slider {
      width: 100%;
      margin-bottom: 0.75rem;
    }

    .time-display {
      display: flex;
      width: 100%;
      justify-content: space-between;
    }

    .amplitude-current-time,
    .amplitude-duration-time {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.025em;
      color: #0ea5e9;
    }

    .dark .amplitude-current-time {
      color: #38bdf8;
    }

    .amplitude-duration-time {
      color: #64748b;
    }

    .controls {
      height: 4.5rem;
      padding: 0 2.5rem;
      border-radius: 0 0 0.75rem 0.75rem;
      background: #f9fafb;
      border-top: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
    }

    .dark .controls {
      background: var(--bg-control);
      border-color: #1f2937;
    }

    .controls button {
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .controls button svg {
      fill: #64748b;
    }

    .dark .controls button svg {
      fill: #94a3b8;
    }

    .play-pause-btn {
      width: 6rem;
      height: 6rem;
      border-radius: 50%;
      background: #fff;
      border: 1px solid var(--border-light-2);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dark .play-pause-btn {
      background: #2f3b4f;
      border-color: rgba(255, 255, 255, 0.06);
    }

    .play-pause-btn svg {
      fill: #64748b;
    }

    .dark .play-pause-btn svg {
      fill: #94a3b8;
    }

    #pause-icon {
      display: none;
    }

    .amplitude-playing #pause-icon {
      display: block;
    }

    .amplitude-playing #play-icon {
      display: none;
    }

    .amplitude-paused #pause-icon {
      display: none;
    }

    .amplitude-paused #play-icon {
      display: block;
    }

    .amplitude-shuffle.amplitude-shuffle-on svg,
    .amplitude-repeat-song.amplitude-repeat-song-on svg {
      fill: #38bdf8;
    }

    #song-saved.saved svg path {
      fill: #38bdf8;
      stroke: #38bdf8;
    }

    /* Range slider styling */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      -moz-appearance: none;
      height: 8px;
      background: #f1f5f9;
      border-radius: 5px;
      background-image: linear-gradient(#38bdf8, #38bdf8);
      background-size: 0% 100%;
      background-repeat: no-repeat;
    }

    .dark input[type="range"] {
      background: #0f172a;
      background-image: linear-gradient(#38bdf8, #38bdf8);
      background-size: 0% 100%;
      box-shadow: 0px 1px 1px rgba(255, 255, 255, 0.06);
      background-repeat: no-repeat;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      -moz-appearance: none;
      height: 24px;
      width: 24px;
      border-radius: 50%;
      background: #fff;
      cursor: ew-resize;
      box-shadow: var(--shadow-button);
      -webkit-transition: background .3s ease-in-out;
      transition: background .3s ease-in-out;
    }

    .dark input[type="range"]::-webkit-slider-thumb,
    .dark input[type="range"]::-moz-range-thumb,
    .dark input[type="range"]::-ms-thumb {
      background: #e2e8f0;
    }

    input[type="range"]::-webkit-slider-runnable-track,
    input[type="range"]::-moz-range-track,
    input[type="range"]::-ms-track {
      -webkit-appearance: none;
      appearance: none;
      -moz-appearance: none;
      box-shadow: none;
      border: none;
      background: transparent;
    }

    /* Links section */
    .links-section {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2.5rem;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .links-section a {
      font-size: 0.75rem;
      font-weight: 500;
      line-height: 1.25rem;
      color: #0284c7;
      background: rgba(56, 189, 248, 0.1);
      border-radius: 9999px;
      padding: 0.25rem 0.75rem;
      display: flex;
      align-items: center;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .dark .links-section a {
      color: #38bdf8;
    }

    .links-section a:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    .links-section a strong {
      font-weight: 600;
    }

    .links-section a svg {
      margin-left: 0.75rem;
      overflow: visible;
      color: #38bdf8;
    }

    .dark .links-section a svg {
      color: #38bdf8;
    }

    .links-section .amplitude-link {
      color: #059669;
      background: rgba(52, 211, 153, 0.1);
    }

    .dark .links-section .amplitude-link {
      color: #34d399;
    }

    .links-section .amplitude-link:hover {
      background: rgba(52, 211, 153, 0.2);
    }

    .links-section .amplitude-link svg {
      color: #34d399;
    }

    .dark .links-section .amplitude-link svg {
      color: #34d399;
    }

    /* Background glow effect */
    .glow-effect {
      display: none;
      position: absolute;
      top: 3.5rem;
      left: 0;
      right: 0;
      width: 100%;
      max-width: 32rem;
      height: 18rem;
      margin: 0 auto;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.17);
      filter: blur(40px);
      z-index: 1;
    }

    .dark .glow-effect {
      display: block;
    }
  </style>
</head>
