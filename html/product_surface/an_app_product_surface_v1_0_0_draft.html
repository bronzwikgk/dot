<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>An App Product Surface</title>
  <link rel="stylesheet" href="./an_app_product_surface_v1_0_0_draft.css">
</head>
<body>
  <header class="top_bar">
    <div>
      <p class="eyebrow">an app</p>
      <h1>Application Builder</h1>
    </div>
    <div class="status_strip" aria-label="status">
      <span id="branch_label">dot_agent_codex_an_app_v1</span>
      <span id="validation_label">ready</span>
    </div>
  </header>

  <main id="an_app_mount" class="workspace" data-mount-target="an_app_mount">
    <aside class="sidebar" aria-label="templates">
      <h2>Templates</h2>
      <div id="template_list" class="template_list"></div>
    </aside>

    <section class="builder_area" aria-label="builder">
      <div class="command_row">
        <input id="command_input" type="text" value="create application builder" aria-label="command input">
        <button id="run_button" type="button">Run</button>
      </div>

      <nav class="projection_tabs" aria-label="layout projections">
        <button type="button" data-profile="json_as_document" class="active">Block Editor</button>
        <button type="button" data-profile="json_as_tree">Tree</button>
        <button type="button" data-profile="json_as_diagram">Diagram</button>
        <button type="button" data-profile="json_as_table">Table</button>
      </nav>

      <section class="preview_band">
        <div>
          <p class="eyebrow">preview</p>
          <h2 id="app_name">application_builder_application</h2>
          <p id="preview_path">/preview/app_application_builder_demo</p>
        </div>
        <div class="summary_grid" id="summary_grid"></div>
      </section>

      <section class="surface_grid">
        <article class="panel main_panel">
          <h2 id="projection_title">Block Editor</h2>
          <div id="projection_view" class="projection_view"></div>
        </article>
        <article class="panel">
          <h2>Audit</h2>
          <dl id="audit_view"></dl>
        </article>
      </section>
    </section>
  </main>

  <script src="./an_app_product_surface_v1_0_0_draft.js"></script>
</body>
</html>
