<script type="module">
import { decompose } from './js/decompose.js';
import { resolve } from './js/resolve.js';
import { compose_from_data } from './js/compose.js';
import { render } from './js/render.js';

// Get source HTML from template
const template = document.getElementById('v5_template');
const source_html = template.innerHTML.trim();
document.getElementById('source_html').textContent = source_html;

// Build clone using pipeline
window.buildClone = function() {
    console.log('Starting pipeline...');
    
    // Step 1: Decompose
    console.log('1. Decomposing...');
    const decomposed = decompose(source_html);
    console.log('   Dataset:', decomposed.dataset.length, 'components');
    console.log('   Datamap:', decomposed.datamap.length, 'relationships');
    console.log('   DataTable:', Object.keys(decomposed.datatable).length, 'entries');
    
    // Step 2: Resolve
    console.log('2. Resolving...');
    const resolved = resolve(decomposed);
    console.log('   Valid:', resolved.valid);
    console.log('   Issues:', resolved.issues.length);
    
    // Step 3: Compose
    console.log('3. Composing...');
    const schema = compose_from_data(resolved.resolved);
    console.log('   Root:', schema.type);
    console.log('   Children:', schema.children.length);
    
    // Step 4: Render
    console.log('4. Rendering...');
    const html = render(schema);
    console.log('   HTML length:', html.length);
    
    // Display result
    document.getElementById('clone_output').innerHTML = html;
    
    console.log('Pipeline complete!');
};
</script>
